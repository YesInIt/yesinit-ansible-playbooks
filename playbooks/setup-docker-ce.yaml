---
# Установка Docker CE + compose plugin (`docker compose`) по инструкции docs.docker.com/engine/install.
# Только Debian-подобные (Debian/Ubuntu), на остальных хостах задачи пропускаются.
#
# Быстрый запуск (без прокси):
#   ansible-playbook ./playbooks/setup-docker-ce.yaml --limit <host> -u <user>
# Расширенный запуск с указанием инвентори:
#   ansible-playbook ./playbooks/setup-docker-ce.yaml --limit <host> -u <user> -i inventory/<inventory>
# Расширенный запуск с прокси через -e:
#   ansible-playbook ./playbooks/setup-docker-ce.yaml --limit <host> -u <user> -i inventory/<inventory> -e proxy_url="http://<proxy>:3128"




- name: Setup Docker CE play
  hosts: all
  become: true
  gather_facts: true
  vars:
    docker_release: "{{ ansible_facts.distribution_release }}"
    # Прокси задаётся в inventory (group_vars/host_vars) или через -e, по умолчанию — системный прокси хоста (если есть):
    #   proxy_url: "http://proxy.example.com:3128"   # или "http://user:pass@proxy.example.com:3128"

  tasks:
    - name: Block setup Docker CE for Debian family
      when: ansible_facts.os_family == 'Debian'
      # Прокси для всего блока: и для скачивания GPG-ключа, и для apt; без proxy_url — системный прокси хоста
      environment:
        http_proxy: "{{ proxy_url | default(ansible_env.http_proxy | default('')) }}"
        https_proxy: "{{ proxy_url | default(ansible_env.https_proxy | default('')) }}"
      block:
        # Удаление конфликтующих пакетов с docker-ce (список из официальной инструкции)
        - name: Удаление конфликтующих пакетов c docker-ce
          ansible.builtin.apt:
            name:
              - docker.io
              - docker-doc
              - docker-compose
              - docker-compose-v2
              - docker-buildx
              - podman-docker
              - containerd
              - runc
            state: absent

        # python3-debian нужен модулю deb822_repository
        - name: Проверка зависимостей для deb822_repository
          ansible.builtin.apt:
            name:
              - ca-certificates
              - python3-debian
            state: present
            update_cache: yes

        # Ключ качает сам модуль на хосте, поэтому прокси для него — через environment блока
        - name: Репозиторий Docker
          ansible.builtin.deb822_repository:
            name: docker
            uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
            suites: "{{ docker_release }}"
            components: stable
            signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"

        - name: Установка всех пакетов Docker CE и compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            update_cache: yes

        - name: Служба Docker запущена и в автозагрузке
          ansible.builtin.systemd:
            name: docker
            enabled: yes
            state: started
